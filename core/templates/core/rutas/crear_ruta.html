{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 600px;">

  <div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'lista_rutas' %}" class="btn btn-outline-secondary btn-sm">← Volver</a>
    <h2 class="mb-0">Nueva ruta</h2>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre de la ruta</label>
          <input type="text" name="nombre" class="form-control" placeholder="Ej: Ruta Norte – Sábado" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold">Tipo</label>
            <select name="tipo" class="form-select" required>
              <option value="entrega">Entrega</option>
              <option value="recogida">Recogida</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ today }}" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Empleados en esta ruta</label>
          <div class="border rounded p-3" style="max-height: 220px; overflow-y: auto;">
            {% for empleado in empleados %}
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="empleados"
                     value="{{ empleado.id }}" id="emp_{{ empleado.id }}">
              <label class="form-check-label" for="emp_{{ empleado.id }}">
                {{ empleado.nombre }}
                <small class="text-muted">({{ empleado.get_tipo_empleado_display }})</small>
              </label>
            </div>
            {% endfor %}
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Líder de ruta</label>
          <select name="lider" class="form-select">
            <option value="">— Sin líder designado —</option>
            {% for empleado in empleados %}
            <option value="{{ empleado.id }}">{{ empleado.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Notas</label>
          <textarea name="notas" class="form-control" rows="2" placeholder="Instrucciones especiales..."></textarea>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Crear ruta</button>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
