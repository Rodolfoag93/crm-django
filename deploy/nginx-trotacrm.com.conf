# Apex marketing site (trotacrm.com) → website/dist
# API/media proxy to gunicorn; legacy CRM paths → app.trotacrm.com

# HTTP → HTTPS
server {
    listen 80;
    server_name trotacrm.com www.trotacrm.com;
    return 301 https://trotacrm.com$request_uri;
}

# www → apex
server {
    listen 443 ssl;
    server_name www.trotacrm.com;
    ssl_certificate /etc/letsencrypt/live/trotacrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trotacrm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://trotacrm.com$request_uri;
}

server {
    listen 443 ssl;
    server_name trotacrm.com;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/trotacrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trotacrm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /home/trota/crm-django/website/dist;
    index index.html;

    location /media/ {
        alias /home/trota/crm-django/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /v1/ {
        include proxy_params;
        proxy_pass http://unix:/home/trota/crm-django/gunicorn.sock;
    }

    # Legacy Django HTML CRM → staff portal
    location ~ ^/(admin|accounts|login|logout|static|crm|dashboard|rentas|clientes|productos|empleados|nomina|gastos|asistencia|rutas|mantenimiento|mapa|materiales)(/|$) {
        return 301 https://app.trotacrm.com$request_uri;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
