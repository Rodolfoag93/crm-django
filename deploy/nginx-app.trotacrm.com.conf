# app.trotacrm.com — PWA + API/admin Django
# Mantener en sync con /etc/nginx/sites-enabled/app.trotacrm.com

server {
    listen 80;
    server_name app.trotacrm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.trotacrm.com;

    ssl_certificate /etc/letsencrypt/live/app.trotacrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.trotacrm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Evita fallos TLS 1.3 "bad key share" (OpenSSL 3 + algunos clientes/redes)
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # Fotos de catálogo / evidencias
    client_max_body_size 25M;
    root /home/trota/crm-django/pwa;
    index index.html;

    location /static/ { alias /home/trota/crm-django/staticfiles/; }
    location /media/ { alias /home/trota/crm-django/media/; }

    location /v1/ {
        include proxy_params;
        proxy_pass http://unix:/home/trota/crm-django/gunicorn.sock;
    }
    location /api-auth/ {
        include proxy_params;
        proxy_pass http://unix:/home/trota/crm-django/gunicorn.sock;
    }
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/home/trota/crm-django/gunicorn.sock;
    }

    # Catálogo / formularios Django de animación (no son rutas del SPA)
    location /animacion/ {
        include proxy_params;
        proxy_pass http://unix:/home/trota/crm-django/gunicorn.sock;
    }

    # Login/logout de sesión Django (templates legacy)
    location /accounts/ {
        include proxy_params;
        proxy_pass http://unix:/home/trota/crm-django/gunicorn.sock;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
